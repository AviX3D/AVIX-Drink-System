# Compile l'appli Windows et ajoute AVIX_Drink_System.exe à une release.
# - Automatique : quand une release est publiée sur GitHub.
# - Manuel : onglet Actions > "Release Windows" > Run workflow, en indiquant l'étiquette de la release.
name: Release Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la release à compléter (ex. V4)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilation du .exe
        run: |
          pyinstaller --noconfirm "AVIX Drink System.spec"
          Move-Item "dist/AVIX Drink System.exe" "dist/AVIX_Drink_System.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: AVIX_Drink_System
          path: dist/AVIX_Drink_System.exe

      - name: Ajoute le .exe à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/AVIX_Drink_System.exe
